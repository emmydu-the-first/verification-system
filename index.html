<body>

<div class="container">

  <h1>Email Verification</h1>

  <p>Enter your email to generate a verification code.</p>

  <input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
  >

  <button id="generateBtn" onclick="generateCode()">
    Generate Verification Code
  </button>

  <div class="code-box" id="codeBox">
    <div>Your verification code is:</div>
    <div class="code" id="displayCode"></div>
  </div>

  <input
    type="text"
    id="verificationCode"
    placeholder="Enter verification code"
    inputmode="numeric"
    maxlength="6"
  >

  <button id="verifyBtn" onclick="verifyCode()">
    Verify Code
  </button>

  <div id="message"></div>

</div>

<script>
  // ============================================================
  // SUPABASE SETTINGS
  // ============================================================

  const SUPABASE_URL = "https://xpbjsontsvecjuirpzsz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QhtpxLWj14U2c0K78yY3cg_fpnIuDZq";


  // ============================================================
  // HELPER
  // ============================================================

  function showMessage(message, success = false) {
    const messageBox = document.getElementById("message");

    messageBox.textContent = message;
    messageBox.style.color = success ? "green" : "red";
  }


  // ============================================================
  // GENERATE VERIFICATION CODE
  // ============================================================

  async function generateCode() {

    const emailInput = document.getElementById("email");
    const generateBtn = document.getElementById("generateBtn");

    const email = emailInput.value.trim().toLowerCase();

    if (!email) {
      showMessage("Please enter your email address.");
      return;
    }

    if (!emailInput.checkValidity()) {
      showMessage("Please enter a valid email address.");
      return;
    }

    generateBtn.disabled = true;

    showMessage("Creating verification code...", true);

    // Generate a random 6-digit code
    const code = Math.floor(100000 + Math.random() * 900000).toString();

    // Code expires in 10 minutes
    const expiresAt = new Date(
      Date.now() + 10 * 60 * 1000
    ).toISOString();


    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/verifications",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            email: email,
            code: code,
            verified: false,
            expires_at: expiresAt
          })
        }
      );


      if (!response.ok) {

        const errorText = await response.text();

        console.error("Supabase error:", errorText);

        throw new Error(
          "Supabase returned " +
          response.status +
          ": " +
          errorText
        );
      }


      // Display the code
      document.getElementById("displayCode").textContent = code;

      document.getElementById("codeBox").style.display = "block";

      showMessage(
        "Verification code created and saved.",
        true
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "Could not save verification code.\n\n" +
        error.message
      );

    } finally {

      generateBtn.disabled = false;
    }
  }


  // ============================================================
  // VERIFY CODE
  // ============================================================

  async function verifyCode() {

    const email =
      document.getElementById("email").value.trim().toLowerCase();

    const code =
      document.getElementById("verificationCode").value.trim();

    const verifyBtn =
      document.getElementById("verifyBtn");


    if (!email) {
      showMessage("Please enter your email address.");
      return;
    }

    if (!code) {
      showMessage("Please enter the verification code.");
      return;
    }


    verifyBtn.disabled = true;

    showMessage("Checking verification code...", true);


    try {

      const query =
        SUPABASE_URL +
        "/rest/v1/verifications" +
        "?select=*" +
        "&email=eq." +
        encodeURIComponent(email) +
        "&code=eq." +
        encodeURIComponent(code) +
        "&verified=eq.false" +
        "&order=expires_at.desc" +
        "&limit=1";


      const response = await fetch(
        query,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY
          }
        }
      );


      if (!response.ok) {

        const errorText = await response.text();

        console.error("Supabase error:", errorText);

        throw new Error(
          "Supabase returned " +
          response.status +
          ": " +
          errorText
        );
      }


      const records = await response.json();


      if (!records || records.length === 0) {

        showMessage(
          "Invalid verification code."
        );

        return;
      }


      const record = records[0];


      // Check expiration
      const expiration =
        new Date(record.expires_at).getTime();

      if (Date.now() > expiration) {

        showMessage(
          "This verification code has expired."
        );

        return;
      }


      // Mark as verified
      const updateUrl =
        SUPABASE_URL +
        "/rest/v1/verifications" +
        "?id=eq." +
        encodeURIComponent(record.id);


      const updateResponse = await fetch(
        updateUrl,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },

          body: JSON.stringify({
            verified: true
          })
        }
      );


      if (!updateResponse.ok) {

        const errorText = await updateResponse.text();

        console.error("Supabase update error:", errorText);

        throw new Error(
          "Could not update verification status: " +
          errorText
        );
      }


      showMessage(
        "Email verified successfully!",
        true
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "Verification failed.\n\n" +
        error.message
      );

    } finally {

      verifyBtn.disabled = false;
    }
  }
</script>

</body>
</html>
